<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The QNA - Test Navigator</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/PWa4_filterPage of catogery list.css">

</head>
<body>

    <!-- बैकग्राउंड का डमी कंटेंट (टेस्ट लिस्ट) -->
    <main class="dummy-bg">
        <h2 class="dummy-title">इतिहास टेस्ट सीरीज़</h2>
        <div class="dummy-list">
            <div class="dummy-card"></div>
            <div class="dummy-card"></div>
            <div class="dummy-card"></div>
            <div class="dummy-card"></div>
        </div>
    </main>

    <!-- === Bottom Sheet Modal (Pocket FM Style) === -->
    <div id="testNavigatorModal" class="modal-overlay">
        
        <!-- फ्लोटिंग क्लोज बटन (X) -->
        <div class="close-btn-wrapper">
            <button onclick="closeModal()" class="close-btn" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- शीट का मुख्य कंटेनर -->
        <div class="sheet-container">
            
            <!-- 1. हेडर (Subject Info) -->
            <div class="sheet-header">
                <div class="subject-icon-box">
                    <i class="fa-solid fa-landmark"></i>
                </div>
                <div>
                    <h3 class="subject-title">इतिहास | History Tests</h3>
                    <p class="subject-meta">1000+ Tests &nbsp;•&nbsp; 4.8 <i class="fa-solid fa-star star-icon"></i></p>
                </div>
            </div>

            <!-- 2. ग्रिड नेविगेशन (Test Chunks) -->
            <div class="grid-scroll-area no-scrollbar">
                <div class="test-grid">
                    <button class="grid-btn">1 - 20</button>
                    <button class="grid-btn">21 - 40</button>
                    <button class="grid-btn">41 - 60</button>
                    
                    <button class="grid-btn">61 - 80</button>
                    <button class="grid-btn">81 - 100</button>
                    <button class="grid-btn">101 - 120</button>
                    
                    <button class="grid-btn">121 - 140</button>
                    <button class="grid-btn">141 - 160</button>
                    
                    <!-- Active Chunk (161-180 Active Highlighted) -->
                    <button class="grid-btn-active">161 - 180</button>
                    
                    <button class="grid-btn">181 - 200</button>
                    <button class="grid-btn">201 - 220</button>
                    <button class="grid-btn">221 - 240</button>

                    <button class="grid-btn">241 - 260</button>
                    <button class="grid-btn">261 - 280</button>
                    <button class="grid-btn">281 - 300</button>
                </div>
            </div>

        </div>
    </div>

    <!-- मोडल क्लोज करने के लिए स्क्रिप्ट -->
    <script>
        function closeModal() {
            const modal = document.getElementById('testNavigatorModal');
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
