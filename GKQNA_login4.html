<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govt Jobs GK रील्स मंच - The QNA</title>
    <meta name="description" content="The QNA पर सरकारी नौकरियों के लिए महत्वपूर्ण GK और करंट अफेयर्स के सवाल नए रील्स अंदाज में सीखें।">
    <style>
        /* Global Reset & Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, body.page-body {
    background-color: #030712; /* gray-950 */
    color: #f3f4f6; /* gray-100 */
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-y: auto !important;
    height: auto !important;
}

/* Reels Container */
.reels-container {
    width: 100%;
    background-color: #030712;
    overflow-y: auto !important;
    height: auto !important;
}

.reels-container::-webkit-scrollbar {
    display: none;
}

/* Individual Reel Section */
.reel-section {
    width: 100%;
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    border-bottom: 1px solid #111827; /* gray-900 */
    background: linear-gradient(to bottom, #030712, #111827);
    position: relative;
}

/* Top Bar: Timer & Question Number */
.top-bar {
    width: 100%;
    flex-shrink: 0;
    margin-bottom: 1rem;
}

.top-bar-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.75rem;
    color: #9ca3af; /* gray-400 */
    margin-bottom: 0.375rem;
}

.timer-badge {
    color: #f87171; /* red-400 */
    font-family: monospace;
    font-weight: 700;
    background-color: rgba(69, 10, 10, 0.4); /* red-950/40 */
    border: 1px solid rgba(127, 29, 29, 0.4); /* red-900/40 */
    padding: 0.125rem 0.625rem;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    gap: 0.25rem;
}

.timer-track {
    width: 100%;
    height: 0.375rem;
    background-color: #1f2937; /* gray-800 */
    border-radius: 9999px;
    overflow: hidden;
}

.timer-bar {
    height: 100%;
    background-color: #3b82f6; /* blue-500 */
    width: 100%;
    transition: all 1s linear;
}

/* Question Section */
.question-block {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    position: relative;
    margin-bottom: 1.5rem;
}

.question-text {
    font-size: 1rem;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.375;
    letter-spacing: 0.025em;
    margin-bottom: 0.25rem;
}

@media (min-width: 768px) {
    .question-text {
        font-size: 1.125rem;
    }
}

.exam-tag-wrapper {
    text-align: right;
}

.exam-tag {
    display: inline-block;
    background-color: #1f2937;
    font-size: 9px;
    color: #9ca3af;
    font-weight: 800;
    padding: 0.125rem 0.5rem;
    border-radius: 0.25rem;
    border: 1px solid #374151;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

/* Options Group */
.options-group {
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
}

.option-btn {
    width: 100%;
    text-align: left;
    background-color: rgba(31, 41, 55, 0.6);
    border: 1px solid #374151;
    padding: 0.625rem;
    border-radius: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: #f3f4f6;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
}

.option-btn:hover:not(:disabled) {
    background-color: rgba(55, 65, 81, 0.8);
}

.option-btn .badge {
    background-color: #374151;
    color: #ffffff;
    width: 1.5rem;
    height: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0.5rem;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
}

/* Option Selected States */
.option-btn.correct {
    background-color: #16a34a !important; /* green-600 */
    border-color: #22c55e !important;
    color: #ffffff !important;
}

.option-btn.wrong {
    background-color: #dc2626 !important; /* red-600 */
    border-color: #ef4444 !important;
    color: #ffffff !important;
}

/* Bottom Safety & Social Area */
.bottom-area {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    z-index: 10;
}

.answer-box {
    width: 100%;
    background-color: rgba(5, 46, 22, 0.3); /* green-950/30 */
    border: 1px solid rgba(34, 197, 94, 0.3);
    padding: 0.625rem;
    border-radius: 0.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
}

@media (min-width: 640px) {
    .answer-box {
        flex-direction: row;
    }
}

.answer-box.hidden {
    display: none;
}

.answer-text {
    color: #4ade80; /* green-400 */
    font-weight: 900;
    font-size: 0.75rem;
    letter-spacing: 0.025em;
}

.btn-explain {
    background-color: #16a34a;
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    padding: 0.375rem 0.75rem;
    border-radius: 0.5rem;
    border: none;
    cursor: pointer;
    transition: background-color 0.2s;
    display: flex;
    align-items: center;
    gap: 0.25rem;
    flex-shrink: 0;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.btn-explain:hover {
    background-color: #15803d;
}

.social-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.75rem;
    color: #6b7280;
}

.stats-box {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background-color: rgba(17, 24, 39, 0.8);
    padding: 0.375rem 0.75rem;
    border-radius: 9999px;
    border: 1px solid #1f2937;
}

.btn-like {
    background: none;
    border: none;
    color: inherit;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.25rem;
    transition: color 0.2s;
}

.btn-like:hover, .btn-like.liked {
    color: #ef4444;
}

.divider {
    color: #374151;
}

.views-count {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    font-weight: 700;
}

.actions-box {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.btn-report {
    background-color: rgba(69, 10, 10, 0.4);
    color: #f87171;
    border: 1px solid rgba(127, 29, 29, 0.5);
    font-weight: 700;
    padding: 0.375rem 0.75rem;
    border-radius: 9999px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 0.25rem;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-report:hover {
    background-color: #7f1d1d;
    color: #ffffff;
}

/* Sponsored Ad Section */
.ad-section {
    padding: 3rem 1rem;
    justify-content: space-between;
    background: linear-gradient(to bottom, #1e1b4b, #0f172a, #1e1b4b);
    text-align: center;
}

.ad-label {
    font-size: 10px;
    font-weight: 700;
    color: #818cf8;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 1rem;
}

.ad-content {
    margin: 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.ad-badge {
    width: 4rem;
    height: 4rem;
    background-color: #2563eb;
    color: #ffffff;
    font-size: 1.5rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 1rem;
    margin: 0 auto;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
}

.ad-title {
    font-size: 1.25rem;
    font-weight: 800;
    color: #ffffff;
    padding: 0 1rem;
    line-height: 1.25;
}

.ad-desc {
    font-size: 0.75rem;
    color: #9ca3af;
    max-width: 20rem;
    margin: 0 auto;
}

/* Context Explanation Bottom Sheet */
.explanation-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    max-width: 32rem; /* 512px */
    margin: 0 auto;
    background-color: #111827;
    border-top: 2px solid #2563eb;
    border-top-left-radius: 1.5rem;
    border-top-right-radius: 1.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    transform: translateY(100%);
    transition: transform 0.3s ease-out;
    padding: 1.5rem;
    color: #e5e7eb;
}

.explanation-sheet.active {
    transform: translateY(0);
}

.sheet-handle {
    width: 3rem;
    height: 0.375rem;
    background-color: #374151;
    border-radius: 9999px;
    margin: 0 auto 1rem auto;
    cursor: pointer;
}

.sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #1f2937;
    padding-bottom: 0.75rem;
    margin-bottom: 1rem;
}

.sheet-title {
    font-size: 1rem;
    font-weight: 900;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.btn-close {
    background-color: #1f2937;
    color: #9ca3af;
    border: none;
    font-weight: 700;
    font-size: 0.875rem;
    padding: 0.25rem 0.625rem;
    border-radius: 9999px;
    cursor: pointer;
}

.btn-close:hover {
    color: #ffffff;
}

.sheet-body {
    font-size: 0.875rem;
    color: #d1d5db;
    line-height: 1.625;
    max-height: 300px;
    overflow-y: auto;
    font-weight: 500;
}

/* Background Overlay */
.sheet-overlay {
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.6);
    z-index: 40;
}

.sheet-overlay.hidden {
    display: none;
}
    </style>
    <link rel="stylesheet" href="css/GKQNA_login4.css">
</head>
<body class="page-body">

    <!-- REELS STYLE MAIN CONTAINER -->
    <main id="reels-wrapper" class="reels-container">
        <!-- सवाल और विज्ञापन यहाँ जावास्क्रिप्ट से लोड होंगे -->
    </main>

    <!-- NEW: DYNAMIC BOTTOM EXPLANATION SHEET (Context Modal) -->
    <div id="explanation-sheet" class="explanation-sheet">
        <div class="sheet-handle" onclick="closeExplanation()"></div>
        <div class="sheet-header">
            <h3 class="sheet-title">
                📖 उत्तर का प्रामाणिक संदर्भ (Context)
            </h3>
            <button onclick="closeExplanation()" class="btn-close">बंद करें</button>
        </div>
        <div id="explanation-text" class="sheet-body">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Background overlay when context opens -->
    <div id="sheet-overlay" class="sheet-overlay hidden" onclick="closeExplanation()"></div>

    <script>
        // GK क्वेश्चन बैंक
        const gkQuestionBank = [
            { 
                id: 1, 
                q: "भारतीय संविधान का जनक किसे कहा जाता है?", 
                a: "डॉ. बी.आर. अम्बेडकर", b: "महात्मा गांधी", c: "जवाहरलाल नेहरू", d: "डॉ. राजेन्द्र प्रसाद", 
                correct: "A", exam: "UPPCS", year: "2024", likes: 245, views: "1.2K",
                context: "डॉ. भीमराव अम्बेडकर को भारतीय संविधान का जनक और निर्माता कहा जाता है क्योंकि वह संविधान का मसौदा तैयार करने वाली 'प्रारूप समिति' के अध्यक्ष थे।"
            },
            { 
                id: 2, 
                q: "भारत में किस राज्य की तटरेखा (Coastline) सबसे लंबी है?", 
                a: "महाराष्ट्र", b: "तमिलनाडु", c: "गुजरात", d: "आंध्र प्रदेश", 
                correct: "C", exam: "SSC CGL", year: "2023", likes: 189, views: "940",
                context: "भारत की मुख्य भूमि की कुल तटरेखा लगभग 5422 किलोमीटर लंबी है, जिसमें अकेले गुजरात राज्य की तटरेखा सबसे लंबी है।"
            }
        ];

        const wrapper = document.getElementById('reels-wrapper');
        let activeTimers = {};

        // रील कार्ड जनरेटर कोड
        function createQuestionReelHTML(item, index) {
            return `
                <div id="reel-${index}" class="reel-section" data-correct="${item.correct}" data-index="${index}">
                    
                    <!-- Top Bar: Timer & Number -->
                    <div class="top-bar">
                        <div class="top-bar-info">
                            <span>सवाल नंबर: #0${index + 1}</span>
                            <span class="timer-badge">
                                ⏱️ <span class="timer-text">15</span>s
                            </span>
                        </div>
                        <div class="timer-track">
                            <div class="timer-bar"></div>
                        </div>
                    </div>

                    <!-- Question & Options Block -->
                    <div class="question-block">
                        <div>
                            <h2 class="question-text">
                                ${item.q}
                            </h2>
                            <div class="exam-tag-wrapper">
                                <span class="exam-tag">
                                    📋 ${item.exam} (${item.year})
                                </span>
                            </div>
                        </div>

                        <!-- 4 Options Grid -->
                        <div class="options-group">
                            <button onclick="checkAnswer(this, 'A')" class="option-btn">
                                <span class="badge">A</span>
                                <span>${item.a}</span>
                            </button>
                            <button onclick="checkAnswer(this, 'B')" class="option-btn">
                                <span class="badge">B</span>
                                <span>${item.b}</span>
                            </button>
                            <button onclick="checkAnswer(this, 'C')" class="option-btn">
                                <span class="badge">C</span>
                                <span>${item.c}</span>
                            </button>
                            <button onclick="checkAnswer(this, 'D')" class="option-btn">
                                <span class="badge">D</span>
                                <span>${item.d}</span>
                            </button>
                        </div>
                    </div>

                    <!-- Bottom Safety & Social Area -->
                    <div class="bottom-area">
                        <div class="answer-box hidden">
                            <span class="answer-text">
                                सही उत्तर: Option (${item.correct}) - प्रामाणिक सवाल।
                            </span>
                            <button onclick="openExplanation(${index})" class="btn-explain">
                                <span>विस्तृत व्याख्या पढ़ें 📖</span>
                            </button>
                        </div>

                        <div class="social-bar">
                            <div class="stats-box">
                                <button onclick="toggleLike(this)" class="btn-like">
                                    <span>🤍</span> <span><span class="like-count">${item.likes}</span></span>
                                </button>
                                <span class="divider">|</span>
                                <div class="views-count">
                                    <span>👁️</span> <span>${item.views}</span>
                                </div>
                            </div>

                            <div class="actions-box">
                                <button onclick="reportQuestionError(${item.id})" class="btn-report">
                                    <span>🚨</span> <span>रिपोर्ट करें</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function createFullScreenAdHTML() {
            return `
                <div class="reel-section ad-section">
                    <span class="ad-label">Sponsored Advertisement</span>
                    <div class="ad-content">
                        <div class="ad-badge">AD</div>
                        <h3 class="ad-title">Google AdSense Full-Display</h3>
                        <p class="ad-desc">High CPM विज्ञापन स्लॉट।</p>
                    </div>
                </div>
            `;
        }

        function openExplanation(originalIndex) {
            const itemIndex = originalIndex % gkQuestionBank.length;
            const item = gkQuestionBank[itemIndex];
            document.getElementById('explanation-text').innerText = item.context;
            document.getElementById('sheet-overlay').classList.remove('hidden');
            const sheet = document.getElementById('explanation-sheet');
            sheet.classList.add('active');
        }

        function closeExplanation() {
            document.getElementById('sheet-overlay').classList.add('hidden');
            const sheet = document.getElementById('explanation-sheet');
            sheet.classList.remove('active');
        }

        function reportQuestionError(questionId) {
            alert(`⚠️ रिपोर्ट दर्ज कर ली गई है।`);
        }

        function checkAnswer(selectedBtn, selectedOption) {
            const reel = selectedBtn.closest('.reel-section');
            const correctOption = reel.getAttribute('data-correct');
            const optionsGroup = reel.querySelector('.options-group');
            const allButtons = optionsGroup.querySelectorAll('.option-btn');
            
            const reelIndex = reel.getAttribute('data-index');
            clearInterval(activeTimers[reelIndex]);

            allButtons.forEach(btn => btn.disabled = true);
            allButtons.forEach(btn => {
                const optionLetter = btn.querySelector('.badge').innerText;
                if (optionLetter === correctOption) {
                    btn.classList.add('correct');
                } else if (optionLetter === selectedOption && selectedOption !== correctOption) {
                    btn.classList.add('wrong');
                }
            });
            reel.querySelector('.answer-box').classList.remove('hidden');
        }

        function startTimerForReel(reelElement, index) {
            let timeLeft = 15;
            const timerText = reelElement.querySelector('.timer-text');
            const timerBar = reelElement.querySelector('.timer-bar');
            
            if(activeTimers[index]) clearInterval(activeTimers[index]);
            timerBar.style.width = '100%';

            activeTimers[index] = setInterval(() => {
                timeLeft--;
                if(timerText) timerText.innerText = timeLeft;
                let percentage = (timeLeft / 15) * 100;
                if(timerBar) timerBar.style.width = percentage + '%';

                if (timeLeft <= 0) {
                    clearInterval(activeTimers[index]);
                    const correctOption = reelElement.getAttribute('data-correct');
                    const firstCorrectBtn = Array.from(reelElement.querySelectorAll('.option-btn')).find(btn => btn.querySelector('.badge').innerText === correctOption);
                    if(firstCorrectBtn) checkAnswer(firstCorrectBtn, null);
                }
            }, 1000);
        }

        function initScrollObserver() {
            const observerOptions = { root: wrapper, threshold: 0.4 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const reelIndex = entry.target.getAttribute('data-index');
                        if (reelIndex !== null) {
                            startTimerForReel(entry.target, reelIndex);
                        }
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.reel-section[data-index]').forEach(reel => {
                observer.observe(reel);
            });
        }

        function renderReelsEngine() {
            let combinedHTML = "";
            let totalQuestions = 0;
            for (let loop = 0; loop < 5; loop++) {
                gkQuestionBank.forEach((item) => {
                    combinedHTML += createQuestionReelHTML(item, totalQuestions);
                    totalQuestions++;
                    if (totalQuestions % 10 === 0) combinedHTML += createFullScreenAdHTML();
                });
            }
            wrapper.innerHTML = combinedHTML;
            setTimeout(initScrollObserver, 100);
        }

        function toggleLike(btn) {
            const heartIcon = btn.querySelector('span:first-child');
            const countSpan = btn.querySelector('.like-count');
            let currentCount = parseInt(countSpan.innerText);
            if (heartIcon.innerText === '🤍') {
                heartIcon.innerText = '❤️'; 
                countSpan.innerText = currentCount + 1; 
                btn.classList.add('liked');
            } else {
                heartIcon.innerText = '🤍'; 
                countSpan.innerText = currentCount - 1; 
                btn.classList.remove('liked');
            }
        }

        renderReelsEngine();
    </script>
</body>
