<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The QNA - विस्तृत रिजल्ट रिपोर्ट</title>

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/Result.css">

</head>
<body>

    <!-- रिजल्ट और रिपोर्ट सेक्शन -->
    <div id="result-box" class="result-container">
        
        <!-- स्टूडेंट प्रोफाइल -->
        <div id="student-profile" class="student-profile-card">
            <h1 class="profile-title">आपका विस्तृत रिजल्ट</h1>
            <div class="profile-info">
                <p>नाम: <span id="display-name" class="info-value">विजय</span></p>
                <p>पता: <span id="display-address" class="info-value">सनौली</span></p>
            </div>
        </div>
        
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <p class="stat-label">सही</p>
                <p class="stat-number text-green" id="stat-correct">50</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">गलत</p>
                <p class="stat-number text-red" id="stat-wrong">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">कुल समय</p>
                <p class="stat-number" id="stat-time">30m</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">औसत/प्रश्न</p>
                <p class="stat-number" id="stat-avg">0.6s</p>
            </div>
        </div>

        <!-- विस्तृत व्याख्या (Context Analysis) -->
        <div id="analysis-box" class="analysis-container">
            <!-- यहाँ JS से 50 प्रश्नों का डेटा लोड होगा -->
        </div>

        <!-- शेयर एवं सबमिट बटन -->
        <div class="action-box">
            <button onclick="window.print()" class="submit-btn">
                <i class="fa-solid fa-print" style="margin-right: 8px;"></i>रिजल्ट सबमिट और शेयर करें
            </button>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script>
        const questions = [
            {q: "भारतीय संविधान का जनक कौन है?", context: "डॉ. बी.आर. अम्बेडकर प्रारूप समिति के अध्यक्ष थे, इसलिए उन्हें जनक कहा जाता है।"},
            {q: "भारत का प्रथम गवर्नर जनरल?", context: "लॉर्ड विलियम बेंटिक 1833 में भारत के प्रथम गवर्नर जनरल बने।"},
            {q: "सबसे लंबा तटरेखा वाला राज्य?", context: "गुजरात की तटरेखा सबसे लंबी (लगभग 1214 किमी) है।"}
        ];

        // 50 प्रश्नों तक का लूप
        for(let i = 4; i <= 50; i++) {
            questions.push({
                q: `प्रश्न संख्या ${i} यहाँ है?`, 
                context: "यह एक अभ्यास प्रश्न है जिसका सही विकल्प A है।"
            });
        }

        // रिजल्ट दिखाने का फंक्शन
        function displayResults() {
            let analysis = questions.map((q, i) => `
                <div class="question-card">
                    <p class="question-title">प्रश्न ${i+1}: ${q.q}</p>
                    <p class="question-context">संदर्भ: ${q.context}</p>
                </div>
            `).join('');
            document.getElementById('analysis-box').innerHTML = analysis;
        }

        displayResults();
    </script>
</body>
</html>
