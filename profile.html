<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile - The QNA</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/profile.css">
  
</head>
<body>

    <!-- === 1. टॉप हेडर === -->
    <header>
        <div class="app-container header-inner">
            <h1 class="header-title">My Profile</h1>
            <button aria-label="Settings" class="icon-btn">
                <i class="fa-solid fa-gear" style="font-size: 14px;"></i>
            </button>
        </div>
    </header>

    <!-- === 2. मुख्य प्रोफाइल कंटेंट एरिया === -->
    <main class="app-container no-scrollbar">
        
        <!-- 1. यूजर इन्फो कार्ड -->
        <div class="profile-hero">
            <div class="avatar-container">
                <div class="avatar-ring">
                    <img id="profilePhoto" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Vijay" alt="Profile" class="avatar-img">
                </div>
                <!-- प्रीमियम बैज -->
                <div class="premium-badge">
                    <i class="fa-solid fa-crown" style="font-size: 8px;"></i> Premium
                </div>
            </div>

            <h2 id="profileName" class="user-name">विजय कुमार</h2>
            <p id="profileEmail" class="user-email">student@example.com</p>
            
            <a href="./edit_profile.html">
                <button class="btn-edit-profile">Edit Profile</button>
            </a>
        </div>

        <!-- 2. परफॉरमेंस स्टेट्स -->
        <div class="stats-grid">
            <div class="pro-card stat-card">
                <i class="fa-solid fa-trophy stat-icon" style="color: #F59E0B;"></i>
                <span class="stat-value">#142</span>
                <span class="stat-label">Global Rank</span>
            </div>
            
            <div class="pro-card stat-card">
                <i class="fa-solid fa-bullseye stat-icon" style="color: #60A5FA;"></i>
                <span class="stat-value">86%</span>
                <span class="stat-label">Accuracy</span>
            </div>

            <a href="./Click_catogery_catogeyrHomepage.html" style="text-decoration: none;">
                <div class="pro-card stat-card">
                    <i class="fa-solid fa-file-signature stat-icon" style="color: #34D399;"></i>
                    <span class="stat-value">24</span>
                    <span class="stat-label">Tests Done</span>
                </div>
            </a>
        </div>

        <!-- 3. सब्सक्रिप्शन / पास स्टेटस -->
        <div class="pro-card subscription-card">
            <div class="bg-glow"></div>
            
            <div class="sub-inner">
                <div>
                    <h3 class="sub-title">QNA Premium Pass</h3>
                    <p class="sub-validity">वैधता: <span>14 Aug 2026</span></p>
                </div>
                <button class="btn-renew">Renew Pass</button>
            </div>
        </div>

        <!-- 4. एकाउंट मेन्यू लिस्ट -->
        <div class="pro-card menu-list">
            
            <!-- Option 1 -->
            <a href="./payment.html" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon-box bg-blue-subtle">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <span class="menu-label">Payment History</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Option 2 -->
            <a href="#" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon-box bg-purple-subtle">
                        <i class="fa-solid fa-bookmark"></i>
                    </div>
                    <span class="menu-label">Saved Questions</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Option 3 -->
            <a href="#" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon-box bg-emerald-subtle">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="menu-label">My Performance Analysis</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Option 4 -->
            <a href="#" id="logoutBtn" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon-box bg-red-subtle">
                        <i class="fa-solid fa-power-off"></i>
                    </div>
                    <span class="menu-label text-danger">Log Out</span>
                </div>
            </a>
            
        </div>

        <!-- वर्ज़न इन्फो -->
        <div class="version-text">
            <p>The QNA App Version 1.0.4</p>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            location.href = "signup.html";
        } else {
            if (user.name) document.getElementById("profileName").textContent = user.name;
            if (user.email) document.getElementById("profileEmail").textContent = user.email;
            if (user.photo) document.getElementById("profilePhoto").src = user.photo;
        }

        // Logout Event Listener
        document.getElementById("logoutBtn").addEventListener("click", function (e) {
            e.preventDefault();

            if (confirm("Logout from The QNA?")) {
                localStorage.removeItem("user");
                location.href = "signup.html";
            }
        });
    </script>
</body>
</html>
